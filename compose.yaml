name: chess-tabiya

services:
  server:
    image: chess-tabiya-server:dev
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_PATH: /data/chess-tabiya.sqlite
      ENGINE_MODE: ${ENGINE_MODE:-mock}
      TABIYA_COOKIE_SECURE: "false"
      MAIA_HOST: maia
      MAIA_PORT: "7000"
      PORT: "3000"
      STOCKFISH_PATH: /usr/games/stockfish
    ports:
      - "${TABIYA_PORT:-3000}:3000"
    volumes:
      - tabiya-data:/data
    depends_on:
      maia:
        condition: service_healthy
        required: false
    restart: unless-stopped

  maia:
    profiles: [engines]
    image: chess-tabiya-maia:dev
    build:
      context: workers/maia
    entrypoint: ["python", "/opt/chess-tabiya/maia-sidecar.py"]
    environment:
      MAIA_LISTEN_HOST: 0.0.0.0
      MAIA_LISTEN_PORT: "7000"
      MAIA_READY_FILE: /ready
      # Optional in development: the running image's OCI identity (see docs/provider-health.md).
      MAIA_IMAGE_ID: ${MAIA_IMAGE_ID:-}
      MAIA_MANIFEST_DIGEST: ${MAIA_MANIFEST_DIGEST:-}
      MAIA_CONFIG_DIGEST: ${MAIA_CONFIG_DIGEST:-}
    healthcheck:
      test: ["CMD", "test", "-f", "/ready"]
      interval: 5s
      timeout: 2s
      start_period: 90s
      retries: 12
    restart: unless-stopped

  dev:
    profiles: [devcontainer]
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - .:/workspace/chess-tabiya:cached
    working_dir: /workspace/chess-tabiya

volumes:
  tabiya-data:
