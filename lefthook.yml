glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: staged-diff
      run: git diff --cached --check

    - name: staged-file-sizes
      run: node tools/git-size-check.mjs --staged

    - name: runtime-typecheck
      glob: "packages/runtime/**/*.{ts,js}"
      run: pnpm --filter @chess-tabiya/runtime typecheck

    - name: schema-typecheck
      glob: "packages/schema/**/*.{ts,js}"
      run: pnpm --filter @chess-tabiya/schema typecheck

    - name: server-typecheck
      glob: "apps/server/**/*.{ts,js}"
      run: pnpm --filter @chess-tabiya/server typecheck

    - name: web-typecheck
      glob: "apps/web/**/*.{ts,js,svelte}"
      run: pnpm --filter @chess-tabiya/web typecheck

    - name: process-contracts
      glob:
        - "design/**/*.md"
        - "rfc/**/*.md"
        - "planning/**/*.md"
        - "planning/roadmap-1.0.json"
        - "tools/{register-check,status-parity,work-index,roadmap-check,intent-parity-harness}/**/*"
        - "tools/roadmap-check*.mjs"
        - "tools/staged-process-contracts*.mjs"
      run: node tools/staged-process-contracts.mjs

    - name: semantic-authority-history
      glob:
        - "design/research/semantic-validation-owner-authorities.json"
        - "packages/runtime/src/semantic-validation*.{ts,json}"
        - "tools/semantic-validation-owner-transition.ts"
        - "planning/work-state.json"
        - "Makefile"
        - "lefthook.yml"
      run: make semantic-validation-owner-transition-check

    - name: capability-history
      glob:
        - "packages/runtime/src/capability/**/*.{ts,json}"
        - "tools/capability-history*.mjs"
        - "Makefile"
        - "lefthook.yml"
      run: node tools/capability-history.mjs --staged

    - name: scaffold
      glob:
        - "Makefile"
        - "package.json"
        - "pnpm-lock.yaml"
        - "pnpm-workspace.yaml"
        - "lefthook.yml"
        - ".github/workflows/**/*"
        - "tools/verify-scaffold*"
        - "tools/ci-local*"
      run: node --test tools/verify-scaffold.test.mjs tools/ci-local.test.mjs && node tools/verify-scaffold.mjs && ./node_modules/.bin/lefthook validate
