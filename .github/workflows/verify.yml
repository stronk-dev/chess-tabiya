name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      ENGINES_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install checksum-pinned Stockfish 18
        run: |
          tools/install-stockfish-linux.sh "$RUNNER_TEMP/stockfish"
          echo "SF_CMD=$RUNNER_TEMP/stockfish/bin/stockfish" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: make verify
