name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ENGINES_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
      - run: pnpm install --frozen-lockfile
      - run: make verify
