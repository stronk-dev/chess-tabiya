name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      ENGINES_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install checksum-pinned Stockfish 18
        run: |
          tools/install-stockfish-linux.sh "$RUNNER_TEMP/stockfish"
          echo "SF_CMD=$RUNNER_TEMP/stockfish/bin/stockfish" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: make verify

  server:
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chess-tabiya-server:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/chess-tabiya-server:${{ github.sha }}

  maia:
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: workers/maia
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chess-tabiya-maia:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/chess-tabiya-maia:${{ github.sha }}

  compose:
    needs: [server, maia]
    runs-on: ubuntu-24.04
    env:
      SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/chess-tabiya-server@${{ needs.server.outputs.digest }}
      MAIA_IMAGE: ghcr.io/${{ github.repository_owner }}/chess-tabiya-maia@${{ needs.maia.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Render digest-pinned Compose release
        run: |
          mkdir -p release
          sed -e "s|__SERVER_IMAGE__|${SERVER_IMAGE}|g" \
              -e "s|__MAIA_IMAGE__|${MAIA_IMAGE}|g" \
              deploy/compose.release.template.yaml > release/compose.yaml
          docker compose -f release/compose.yaml config --quiet
      - name: Publish release Compose file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" release/compose.yaml --generate-notes
