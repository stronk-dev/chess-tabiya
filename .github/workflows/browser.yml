name: browser

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Product browser journeys
        run: make test-browser-smoke
      - name: Real-content browser integration
        run: make test-browser-content
      - name: Responsive and accessible interaction matrices
        run: make test-browser-matrix
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          retention-days: 14
          path: |
            playwright-report/
            test-results/
