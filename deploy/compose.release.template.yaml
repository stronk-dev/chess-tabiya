name: chess-tabiya

# Release `local` profile (rfc/safe-deployment-profiles.md §3): loopback-only HTTP for one machine.
# For other devices use compose.appliance.yaml (LAN, internal CA) or compose.hosted.yaml (public TLS).
services:
  server:
    image: __SERVER_IMAGE__
    environment:
      DATABASE_PATH: /data/chess-tabiya.sqlite
      ENGINE_MODE: ${ENGINE_MODE:-mock}
      TABIYA_DEPLOYMENT_PROFILE: local
      TABIYA_LISTEN_HOST: 0.0.0.0
      TABIYA_PUBLIC_PORT: ${TABIYA_PORT:-3000}
      MAIA_HOST: maia
      MAIA_PORT: "7000"
      PORT: "3000"
      STOCKFISH_PATH: /usr/games/stockfish
__RELEASE_ENVIRONMENT__
    ports:
      - "127.0.0.1:${TABIYA_PORT:-3000}:3000"
    volumes:
      - tabiya-data:/data
__RELEASE_VOLUME__
    # rfc/verifiable-runtime-distribution.md §5: the core hard limit, no swap.
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      maia:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # The default FOSS `cpu` tier: CPU-only Maia. `core` is the server alone (no profile).
  maia:
    profiles: [engines]
    image: __MAIA_IMAGE__
    entrypoint: ["python", "/opt/chess-tabiya/maia-sidecar.py"]
    environment:
      MAIA_LISTEN_HOST: 0.0.0.0
      MAIA_LISTEN_PORT: "7000"
      MAIA_READY_FILE: /tmp/ready
__MAIA_IDENTITY_ENVIRONMENT__
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 5s
      timeout: 2s
      start_period: 90s
      retries: 12
    # rfc/verifiable-runtime-distribution.md §5: the cpu tier's Maia share (2,048 MiB total), no swap.
    mem_limit: 1536m
    memswap_limit: 1536m
    restart: unless-stopped

volumes:
  tabiya-data:
    name: ${TABIYA_DATA_VOLUME:-chess-tabiya_tabiya-data}
