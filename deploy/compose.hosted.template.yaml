name: chess-tabiya

# rfc/safe-deployment-profiles.md §5 — `hosted`: Internet-facing HTTPS on one exact public hostname
# through the pinned Caddy edge with publicly trusted (ACME) certificates. The application port is
# never published. Required: TABIYA_PUBLIC_HOSTNAME (DNS → this host, 80/443 reachable) and
# TABIYA_ACME_EMAIL. No CDN or second proxy is supported. docs/deployment.md.
services:
  server:
    image: __SERVER_IMAGE__
    environment:
      DATABASE_PATH: /data/chess-tabiya.sqlite
      ENGINE_MODE: ${ENGINE_MODE:-mock}
      TABIYA_DEPLOYMENT_PROFILE: hosted
      TABIYA_PUBLIC_HOSTNAME: ${TABIYA_PUBLIC_HOSTNAME:?set TABIYA_PUBLIC_HOSTNAME to the exact public DNS name}
      TABIYA_LISTEN_HOST: 0.0.0.0
      MAIA_HOST: maia
      MAIA_PORT: "7000"
      PORT: "3000"
      STOCKFISH_PATH: /usr/games/stockfish
      # rfc/verifiable-runtime-distribution.md §4/§9: the verified release index and this image's subject.
      TABIYA_RELEASE_MANIFEST: /run/chess-tabiya/release-manifest.json
      TABIYA_SERVER_IMAGE: __SERVER_IMAGE__
    expose:
      - "3000"
    networks:
      proxy_edge:
        aliases: [tabiya-proxy-origin]
      provider_edge: {}
      egress: {}
    volumes:
      - tabiya-data:/data
      # Download release-manifest.json next to this file; startup verifies it (docs/release.md).
      - ./release-manifest.json:/run/chess-tabiya/release-manifest.json:ro
    # rfc/verifiable-runtime-distribution.md §5: the core hard limit, no swap.
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      maia:
        condition: service_healthy
        required: false
    restart: unless-stopped

  caddy:
    image: docker.io/library/caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      TABIYA_PUBLIC_HOSTNAME: ${TABIYA_PUBLIC_HOSTNAME:?set TABIYA_PUBLIC_HOSTNAME to the exact public DNS name}
      TABIYA_ACME_EMAIL: ${TABIYA_ACME_EMAIL:?set TABIYA_ACME_EMAIL to the ACME account contact}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.hosted:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - public_edge
      - proxy_edge
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # The default FOSS `cpu` tier: CPU-only Maia on the internal provider edge (no Caddy, no egress).
  maia:
    profiles: [engines]
    image: __MAIA_IMAGE__
    entrypoint: ["python", "/opt/chess-tabiya/maia-sidecar.py"]
    environment:
      MAIA_LISTEN_HOST: 0.0.0.0
      MAIA_LISTEN_PORT: "7000"
      MAIA_READY_FILE: /tmp/ready
    networks:
      - provider_edge
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 5s
      timeout: 2s
      start_period: 90s
      retries: 12
    # rfc/verifiable-runtime-distribution.md §5: the cpu tier's Maia share (2,048 MiB total), no swap.
    mem_limit: 1536m
    memswap_limit: 1536m
    restart: unless-stopped

networks:
  proxy_edge:
    internal: true
  provider_edge:
    internal: true
  # Caddy only: published 80/443 and the ACME egress path.
  public_edge: {}
  # Server only: outbound public data sources (Lichess explorer/tablebase). Nothing is published.
  egress: {}

volumes:
  tabiya-data:
    name: ${TABIYA_DATA_VOLUME:-chess-tabiya_tabiya-data}
  caddy-data: {}
  caddy-config: {}
